<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Looe tides today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --page:           #f4f1ea;
    --surface-1:      #fdfbf7;
    --border:         #111111;
    --grid:           rgba(17, 17, 17, 0.14);
    --axis:           #111111;
    --text-primary:   #111111;
    --text-secondary: #4a4a4a;
    --text-muted:     #555555;
    --series-1:       #111111;
    --series-1-fill:  rgba(17, 17, 17, 0.10);
    --now:            #111111;
    --mono: "Space Mono", "Courier New", monospace;
    --serif: "Newsreader", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:           #121314;
      --surface-1:      #1c1d1f;
      --border:         #f4f1ea;
      --grid:           rgba(244, 241, 234, 0.16);
      --axis:           #f4f1ea;
      --text-primary:   #f4f1ea;
      --text-secondary: #b5b3ad;
      --text-muted:     #a0a0a0;
      --series-1:       #f4f1ea;
      --series-1-fill:  rgba(244, 241, 234, 0.12);
      --now:            #f4f1ea;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background-color: var(--page); color: var(--text-primary);
    font: 16px/1.45 var(--serif);
    /* paper grain */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3CfeComponentTransfer%3E%3CfeFuncA type='table' tableValues='0 0.08'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='0.25'/%3E%3C/svg%3E");
  }
  main { max-width: 980px; margin: 0 auto; padding: 24px 20px 32px; }

  /* boxed panels with hard offset shadow */
  .box, .card, .tile, .masthead, footer {
    background: var(--surface-1); border: 2px solid var(--border);
    box-shadow: 3px 3px 0 0 var(--border); border-radius: 0;
  }
  .masthead { padding: 14px 18px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font: 700 30px/1.1 var(--serif); margin: 0; text-transform: uppercase; letter-spacing: 0.04em; }
  .sub { font: 12px var(--mono); color: var(--text-secondary); margin: 4px 0 0; text-transform: uppercase; letter-spacing: 0.06em; }
  .stamp { font: 700 12px var(--mono); border: 2px solid var(--border); padding: 4px 8px; text-transform: uppercase; letter-spacing: 0.08em; }

  .card { padding: 16px 18px; margin-bottom: 16px; }
  .panel-head {
    display: flex; flex-wrap: wrap; gap: 2px 12px; justify-content: space-between; align-items: baseline;
    border-bottom: 2px solid var(--border); padding-bottom: 6px; margin-bottom: 12px;
    font: 700 12px var(--mono); text-transform: uppercase; letter-spacing: 0.15em;
  }
  .panel-head span:last-child { font-weight: 400; letter-spacing: 0.05em; color: var(--text-secondary); }

  .hero-body { display: flex; flex-wrap: wrap; gap: 8px 0; }
  .hero-body > div { flex: 1 1 200px; padding: 0 16px; border-left: 2px solid var(--border); }
  .hero-body > div:first-child { border-left: 0; padding-left: 0; }
  .hero .big { font: 700 44px/1.05 var(--mono); letter-spacing: -0.03em; margin: 2px 0; }
  .hero .label { font: 11px var(--mono); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; }
  .hero .detail { font: 13px var(--mono); color: var(--text-secondary); padding-top: 6px; margin-top: 6px; border-top: 1px dashed var(--border); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .tile { padding: 12px 14px; }
  .tile .kind { font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; display: flex; gap: 6px; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .tile .kind svg { flex: none; }
  .tile .time { font: 700 30px/1.2 var(--mono); letter-spacing: -0.02em; margin-top: 6px; }
  .tile .height { font: 13px var(--mono); color: var(--text-secondary); }
  .tile.past { border-style: dashed; box-shadow: none; }
  .tile.past .time, .tile.past .height { color: var(--text-muted); }
  .tile.past .time { text-decoration: line-through; text-decoration-thickness: 2px; }
  .tile .tag { margin-left: auto; font-weight: 400; font-size: 10px; color: var(--text-muted); }

  .chart-wrap { position: relative; border: 1px solid var(--border); padding: 8px 4px 0; }
  .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-wrap svg:focus { outline: none; }
  .chart-wrap svg:focus-visible { outline: 2px dashed var(--border); outline-offset: 4px; }
  .tick { fill: var(--text-secondary); font: 11px var(--mono); }
  .mark-label { fill: var(--text-primary); font: 700 11px var(--mono); }
  .now-label { fill: var(--text-primary); font: 700 11px var(--mono); text-transform: uppercase; }
  .tooltip {
    position: absolute; pointer-events: none; display: none; white-space: nowrap;
    background: var(--surface-1); border: 2px solid var(--border); box-shadow: 3px 3px 0 0 var(--border);
    padding: 5px 9px; font-family: var(--mono);
  }
  .tooltip strong { display: block; font-size: 15px; }
  .tooltip span { color: var(--text-secondary); font-size: 11px; }

  details summary { cursor: pointer; font: 700 12px var(--mono); text-transform: uppercase; letter-spacing: 0.12em; }
  table { border-collapse: collapse; margin-top: 10px; font: 13px var(--mono); }
  th, td { text-align: left; padding: 3px 18px 3px 0; border-bottom: 1px dashed var(--grid); }
  th { font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.08em; border-bottom: 2px solid var(--border); }
  .cols { columns: 3 220px; }
  footer { font: 11px var(--mono); color: var(--text-secondary); padding: 8px 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  footer a { color: inherit; }
  .error { font-family: var(--mono); }
</style>
</head>
<body>
<main>
  <header class="masthead">
    <div>
      <h1>Looe</h1>
      <p class="sub" id="subtitle">Loading today's tides…</p>
    </div>
    <span class="stamp">Tides</span>
  </header>

  <section class="card hero">
    <div class="panel-head"><span>Now</span><span>UK time</span></div>
    <div class="hero-body" id="hero" aria-live="polite"></div>
  </section>
  <section class="tiles" id="tiles" aria-label="Today's high and low tides"></section>

  <section class="card">
    <div class="panel-head"><span>Tide height today</span><span>m above chart datum</span></div>
    <div class="chart-wrap" id="chart"></div>
  </section>

  <section class="card">
    <details>
      <summary>Half-hourly heights (table view)</summary>
      <div class="cols"><table id="table"><thead><tr><th>Time</th><th>Height (m)</th></tr></thead><tbody></tbody></table></div>
    </details>
  </section>

  <footer>
    Predictions from <a href="https://easytide.admiralty.co.uk/?PortID=0011" target="_blank" rel="noopener">ADMIRALTY EasyTide</a> (UKHO).
    Not for navigation.
  </footer>
</main>

<script>
const STATION = "0011";            // Looe
// On localhost use server.py; everywhere else (GitHub Pages) use the Cloudflare Worker proxy.
// Add ?worker to the URL to force the Worker locally (e.g. http://localhost:8000/?worker).
const useLocal = ["localhost", "127.0.0.1"].includes(location.hostname)
  && !new URLSearchParams(location.search).has("worker");
const API = useLocal
  ? "/api/tides"
  : "https://falling-moon-a7b9.nigel-charlton.workers.dev/api/tides";
const TZ = "Europe/London";
const SVG_NS = "http://www.w3.org/2000/svg";

// ---------- time helpers (everything is shown in UK local time) ----------
const partsFmt = new Intl.DateTimeFormat("en-GB", {
  timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
  hour: "2-digit", minute: "2-digit", hourCycle: "h23",
});
function london(date) {
  const p = Object.fromEntries(partsFmt.formatToParts(date).map(x => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, mins: +p.hour * 60 + +p.minute };
}
const hhmm = m => `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
function duration(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  return h ? `${h} h ${m} min` : `${m} min`;
}

function el(tag, attrs = {}, parent, text) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text != null) node.textContent = text;
  if (parent) parent.appendChild(node);
  return node;
}
function html(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}
function arrowIcon(up) {
  const svg = el("svg", { width: 12, height: 12, viewBox: "0 0 12 12", "aria-hidden": "true" });
  el("path", { d: up ? "M6 1 L11 10 L1 10 Z" : "M6 11 L11 2 L1 2 Z", fill: "var(--series-1)" }, svg);
  return svg;
}

// ---------- data ----------
let state = null;

async function load() {
  const res = await fetch(`${API}?station=${STATION}`);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);

  const now = london(new Date());
  const today = now.date;

  // Half-hourly heights come as UTC ("...Z"); convert to UK local.
  const all = data.tidalHeightOccurrenceList.map(o => {
    const l = london(new Date(o.dateTime));
    return { date: l.date, mins: l.mins, h: o.height };
  });
  const points = all.filter(p => p.date === today);
  const midnight = all.find(p => p.date > today && p.mins === 0);
  if (midnight) points.push({ ...midnight, mins: 1440 });

  // High/low events come as UK local time without an offset.
  const events = data.tidalEventList.map(e => ({
    date: e.dateTime.slice(0, 10),
    mins: +e.dateTime.slice(11, 13) * 60 + +e.dateTime.slice(14, 16),
    high: e.eventType === 0,
    h: e.height,
  }));
  const todayEvents = events.filter(e => e.date === today);
  const nowKey = `${today} ${hhmm(now.mins)}`;
  const next = events.find(e => `${e.date} ${hhmm(e.mins)}` > nowKey);

  state = { now, today, points, todayEvents, next };
}

function heightAt(points, mins) {
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1], b = points[i];
    if (mins >= a.mins && mins <= b.mins) {
      return a.h + (b.h - a.h) * (mins - a.mins) / (b.mins - a.mins);
    }
  }
  return null;
}

// ---------- header, hero, tiles, table ----------
function renderText() {
  const { now, today, points, todayEvents, next } = state;
  const dateLabel = new Date(`${today}T12:00:00Z`).toLocaleDateString("en-GB", {
    weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC",
  });
  document.getElementById("subtitle").textContent = `Tides for ${dateLabel}`;

  const hero = document.getElementById("hero");
  hero.replaceChildren();
  const hNow = heightAt(points, now.mins);
  if (hNow != null) {
    const block = html("div");
    block.append(html("div", "label", "Height now"), html("div", "big", `${hNow.toFixed(2)} m`));
    hero.append(block);
  }
  if (next) {
    const nextMins = (next.date === today ? 0 : 1440) + next.mins - now.mins;
    const block = html("div");
    block.append(
      html("div", "label", next.high ? "Rising · next high" : "Falling · next low"),
      html("div", "big", hhmm(next.mins)),
      html("div", "detail", `${next.h.toFixed(2)} m · in ${duration(nextMins)}${next.date === today ? "" : " (tomorrow)"}`),
    );
    hero.append(block);
  }

  const tiles = document.getElementById("tiles");
  tiles.replaceChildren();
  for (const e of todayEvents) {
    const past = e.mins <= now.mins;
    const tile = html("div", `tile${past ? " past" : ""}`);
    const kind = html("div", "kind");
    kind.append(arrowIcon(e.high), document.createTextNode(e.high ? "High tide" : "Low tide"));
    if (past) kind.append(html("span", "tag", "Passed"));
    tile.append(kind, html("div", "time", hhmm(e.mins)), html("div", "height", `${e.h.toFixed(2)} m`));
    tiles.append(tile);
  }

  const tbody = document.querySelector("#table tbody");
  tbody.replaceChildren();
  for (const p of points) {
    const tr = document.createElement("tr");
    tr.append(html("td", null, p.mins === 1440 ? "24:00" : hhmm(p.mins)), html("td", null, p.h.toFixed(2)));
    tbody.append(tr);
  }
}

// ---------- chart ----------
function renderChart() {
  const { now, points, todayEvents } = state;
  const wrap = document.getElementById("chart");
  wrap.replaceChildren();
  if (points.length < 2) {
    wrap.append(html("p", "error", "No height data available for today."));
    return;
  }

  const W = Math.max(320, wrap.clientWidth), H = 300;
  const m = { l: 36, r: 12, t: 30, b: 28 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const maxH = Math.max(...points.map(p => p.h), ...todayEvents.map(e => e.h));
  const yMax = Math.ceil(maxH + 0.4);
  const x = mins => m.l + (mins / 1440) * iw;
  const y = h => m.t + ih - (Math.max(0, h) / yMax) * ih;

  const svg = el("svg", {
    viewBox: `0 0 ${W} ${H}`, width: W, height: H, tabindex: 0, role: "img",
    "aria-label": "Tide height through today. Use left and right arrow keys to read values.",
  }, wrap);

  // grid + y axis
  for (let v = 0; v <= yMax; v++) {
    el("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }, svg);
    el("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end", class: "tick" }, svg, `${v} m`);
  }
  // x axis
  const step = iw < 520 ? 360 : 180;
  for (let t = 0; t <= 1440; t += step) {
    el("text", { x: x(t), y: H - 8, "text-anchor": t === 0 ? "start" : t === 1440 ? "end" : "middle", class: "tick" }, svg, t === 1440 ? "24:00" : hhmm(t));
  }

  // area + line
  const linePts = points.map(p => `${x(p.mins).toFixed(1)},${y(p.h).toFixed(1)}`);
  el("path", {
    d: `M${x(points[0].mins)},${y(0)} L${linePts.join(" L")} L${x(points.at(-1).mins)},${y(0)} Z`,
    fill: "var(--series-1-fill)",
  }, svg);
  el("path", {
    d: `M${linePts.join(" L")}`, fill: "none", stroke: "var(--series-1)",
    "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round",
  }, svg);

  // now line
  const hNow = heightAt(points, now.mins);
  if (hNow != null) {
    el("line", { x1: x(now.mins), x2: x(now.mins), y1: m.t - 8, y2: y(0), stroke: "var(--now)", "stroke-width": 1, "stroke-dasharray": "3 3" }, svg);
    el("text", { x: x(now.mins), y: m.t - 14, "text-anchor": "middle", class: "now-label" }, svg, `Now ${hhmm(now.mins)}`);
    el("circle", { cx: x(now.mins), cy: y(hNow), r: 5, fill: "var(--surface-1)", stroke: "var(--series-1)", "stroke-width": 2 }, svg);
  }

  // high / low markers with direct labels
  for (const e of todayEvents) {
    const cx = x(e.mins), cy = y(e.h);
    el("circle", { cx, cy, r: 5, fill: "var(--series-1)", stroke: "var(--surface-1)", "stroke-width": 2 }, svg);
    const anchor = cx < m.l + 50 ? "start" : cx > W - m.r - 50 ? "end" : "middle";
    el("text", { x: cx, y: e.high ? cy - 12 : cy + 20, "text-anchor": anchor, class: "mark-label" },
      svg, `${hhmm(e.mins)} · ${e.h.toFixed(2)} m`);
  }

  // crosshair + tooltip
  const cross = el("line", { y1: m.t, y2: y(0), stroke: "var(--text-muted)", "stroke-width": 1, visibility: "hidden" }, svg);
  const dot = el("circle", { r: 5, fill: "var(--series-1)", stroke: "var(--surface-1)", "stroke-width": 2, visibility: "hidden" }, svg);
  const tip = html("div", "tooltip");
  const tipVal = html("strong"), tipTime = html("span");
  tip.append(tipVal, tipTime);
  wrap.append(tip);

  let idx = -1;
  function show(i) {
    idx = Math.max(0, Math.min(points.length - 1, i));
    const p = points[idx], px = x(p.mins), py = y(p.h);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("visibility", "visible");
    tipVal.textContent = `${p.h.toFixed(2)} m`;
    tipTime.textContent = p.mins === 1440 ? "24:00" : hhmm(p.mins);
    tip.style.display = "block";
    const scale = wrap.clientWidth / W;
    const left = px * scale + 12, tw = tip.offsetWidth;
    tip.style.left = `${left + tw > wrap.clientWidth ? px * scale - tw - 12 : left}px`;
    tip.style.top = `${Math.max(0, py * scale - 50)}px`;
  }
  function hide() {
    cross.setAttribute("visibility", "hidden");
    dot.setAttribute("visibility", "hidden");
    tip.style.display = "none";
  }

  const hit = el("rect", { x: m.l, y: 0, width: iw, height: H, fill: "transparent" }, svg);
  hit.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect();
    const mins = ((ev.clientX - r.left) * (W / r.width) - m.l) / iw * 1440;
    let best = 0;
    points.forEach((p, i) => { if (Math.abs(p.mins - mins) < Math.abs(points[best].mins - mins)) best = i; });
    show(best);
  });
  hit.addEventListener("pointerleave", hide);
  svg.addEventListener("keydown", ev => {
    if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") {
      ev.preventDefault();
      const start = idx < 0 ? points.findIndex(p => p.mins >= now.mins) : idx;
      show(start + (idx < 0 ? 0 : ev.key === "ArrowRight" ? 1 : -1));
    } else if (ev.key === "Escape") hide();
  });
  svg.addEventListener("blur", hide);
}

// ---------- boot ----------
async function refresh() {
  try {
    await load();
    renderText();
    renderChart();
  } catch (err) {
    document.getElementById("subtitle").textContent = `Couldn't load tide data: ${err.message}`;
  }
}
refresh();
setInterval(refresh, 5 * 60 * 1000);   // keep "now" current; the server caches upstream for 30 min
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => state && renderChart(), 150);
});
</script>
</body>
</html>
